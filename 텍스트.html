<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>효소형 바이오 연료전지(EBFC) 실시간 시뮬레이터</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --border-color: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 16px;
      max-width: 1000px;
    }

    header h1 {
      font-size: 1.5rem;
      color: #38bdf8;
      margin-bottom: 6px;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    .container {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 16px;
      width: 100%;
      max-width: 1000px;
    }

    .panel {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
    }

    .controls-panel h2 {
      font-size: 1.1rem;
      margin-bottom: 14px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border-color);
    }

    .control-group {
      margin-bottom: 12px;
    }

    .control-group label {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-bottom: 4px;
    }

    .control-group label span.val {
      color: #38bdf8;
      font-weight: bold;
    }

    input[type="range"], select {
      width: 100%;
      accent-color: #38bdf8;
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 6px;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .btn-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-primary { background: #0284c7; color: white; }
    .btn-secondary { background: #475569; color: white; }

    .simulation-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .canvas-container {
      background: #020617;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      padding: 0;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    canvas {
      display: block;
      width: 100%;
      max-width: 700px;
      height: auto;
      background-color: #020617;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .metric-card {
      background: #0f172a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .metric-card .title {
      font-size: 0.7rem;
      color: var(--text-sub);
      margin-bottom: 2px;
    }

    .metric-card .value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #f8fafc;
    }

    .metric-card .unit {
      font-size: 0.65rem;
      color: #64748b;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 0.75rem;
      padding: 8px 12px;
      background: #0f172a;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    @media (max-width: 768px) {
      .container { grid-template-columns: 1fr; }
      .dashboard { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <header>
    <h1>효소형 바이오 연료전지 (EBFC) 실시간 시뮬레이터</h1>
    <p>글루코스 산화효소(Anode) 및 라케이스(Cathode) 반응 메커니즘</p>
  </header>

  <div class="container">
    <div class="panel controls-panel">
      <h2>실험 매개변수 설정</h2>

      <div class="control-group">
        <label>글루코스 농도 <span class="val" id="glucoseVal">50 mM</span></label>
        <input type="range" id="glucoseSlider" min="0" max="100" value="50">
      </div>

      <div class="control-group">
        <label>산소 농도 (O₂) <span class="val" id="o2Val">21 %</span></label>
        <input type="range" id="o2Slider" min="0" max="100" value="21">
      </div>

      <div class="control-group">
        <label>반응 온도 <span class="val" id="tempVal">40 ℃</span></label>
        <input type="range" id="tempSlider" min="10" max="80" value="40">
      </div>

      <div class="control-group">
        <label>전해질 pH <span class="val" id="phVal">5.5</span></label>
        <input type="range" id="phSlider" min="2.0" max="10.0" step="0.1" value="5.5">
      </div>

      <div class="control-group">
        <label>효소 고정화 방식</label>
        <select id="immobSelect">
          <option value="covalent">공유 결합 (Covalent)</option>
          <option value="crosslink">가교 결합 (Cross-linking)</option>
          <option value="adsorption">단순 흡착 (Adsorption)</option>
        </select>
      </div>

      <div class="btn-group">
        <button class="btn-primary" id="playBtn">일시정지</button>
        <button class="btn-secondary" id="resetBtn">초기화</button>
      </div>
    </div>

    <div class="simulation-area">
      <div class="panel canvas-container">
        <!-- 캔버스 고정 해상도 700x380 직접 부여 -->
        <canvas id="simCanvas" width="700" height="380"></canvas>
      </div>

      <div class="legend">
        <div class="legend-item"><div class="dot" style="background:#22c55e"></div> 글루코스</div>
        <div class="legend-item"><div class="dot" style="background:#f59e0b"></div> 글루코노락톤</div>
        <div class="legend-item"><div class="dot" style="background:#facc15"></div> 전자 (e⁻)</div>
        <div class="legend-item"><div class="dot" style="background:#ef4444"></div> 수소 이온 (H⁺)</div>
        <div class="legend-item"><div class="dot" style="background:#38bdf8"></div> 산소 (O₂)</div>
        <div class="legend-item"><div class="dot" style="background:#60a5fa"></div> 물 (H₂O)</div>
      </div>

      <div class="dashboard">
        <div class="metric-card">
          <div class="title">효소 상대 활성도</div>
          <div class="value" id="activityOut">100</div>
          <div class="unit">%</div>
        </div>
        <div class="metric-card">
          <div class="title">출력 전압</div>
          <div class="value" id="voltageOut">0.58</div>
          <div class="unit">V</div>
        </div>
        <div class="metric-card">
          <div class="title">전류 밀도</div>
          <div class="value" id="currentOut">1.42</div>
          <div class="unit">mA/cm²</div>
        </div>
        <div class="metric-card">
          <div class="title">전력 밀도</div>
          <div class="value" id="powerOut">0.82</div>
          <div class="unit">mW/cm²</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 강제 동기식 시작 함수
    (function startSimulation() {
      const canvas = document.getElementById('simCanvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      const W = 700;
      const H = 380;

      const glucoseSlider = document.getElementById('glucoseSlider');
      const o2Slider = document.getElementById('o2Slider');
      const tempSlider = document.getElementById('tempSlider');
      const phSlider = document.getElementById('phSlider');
      const immobSelect = document.getElementById('immobSelect');

      const glucoseVal = document.getElementById('glucoseVal');
      const o2Val = document.getElementById('o2Val');
      const tempVal = document.getElementById('tempVal');
      const phVal = document.getElementById('phVal');

      const activityOut = document.getElementById('activityOut');
      const voltageOut = document.getElementById('voltageOut');
      const currentOut = document.getElementById('currentOut');
      const powerOut = document.getElementById('powerOut');

      const playBtn = document.getElementById('playBtn');
      const resetBtn = document.getElementById('resetBtn');

      let isRunning = true;
      let particles = [];

      glucoseSlider.oninput = e => glucoseVal.textContent = e.target.value + ' mM';
      o2Slider.oninput = e => o2Val.textContent = e.target.value + ' %';
      tempSlider.oninput = e => tempVal.textContent = e.target.value + ' ℃';
      phSlider.oninput = e => phVal.textContent = parseFloat(e.target.value).toFixed(1);

      playBtn.onclick = () => {
        isRunning = !isRunning;
        playBtn.textContent = isRunning ? '일시정지' : '재생';
        if (isRunning) loop();
      };

      resetBtn.onclick = () => { particles = []; };

      function calculatePhysics() {
        const temp = parseFloat(tempSlider.value);
        const ph = parseFloat(phSlider.value);
        const glucose = parseFloat(glucoseSlider.value);
        const o2 = parseFloat(o2Slider.value);
        const immob = immobSelect.value;

        let tempFactor = (temp <= 40) ? Math.pow(temp / 40, 2) : Math.max(0, 1 - Math.pow((temp - 40) / 25, 2));
        const phFactor = Math.exp(-Math.pow(ph - 5.5, 2) / 3.0);
        let immobFactor = (immob === 'covalent') ? 1.0 : (immob === 'crosslink' ? 0.88 : 0.65);

        const glucoseFactor = glucose / (glucose + 15);
        const o2Factor = o2 / (o2 + 10);

        const totalActivity = tempFactor * phFactor * immobFactor * 100;
        const currentDensity = (totalActivity / 100) * glucoseFactor * o2Factor * 2.5;
        const voltage = Math.max(0, 0.78 - (currentDensity * 0.15));
        const powerDensity = voltage * currentDensity;

        return {
          activity: Math.round(totalActivity),
          voltage: voltage.toFixed(2),
          current: currentDensity.toFixed(2),
          power: powerDensity.toFixed(2),
          rate: (totalActivity / 100) * (glucose / 50)
        };
      }

      function spawnParticles(rate) {
        if (Math.random() < 0.3 * rate) {
          particles.push({
            type: 'glucose',
            x: 20 + Math.random() * 30,
            y: H * 0.3 + Math.random() * (H * 0.5),
            vx: 1.5 + Math.random(),
            vy: (Math.random() - 0.5) * 0.5,
            remove: false
          });
        }
        if (Math.random() < 0.3 * (parseFloat(o2Slider.value) / 50)) {
          particles.push({
            type: 'o2',
            x: W - 30 - Math.random() * 30,
            y: H * 0.3 + Math.random() * (H * 0.5),
            vx: -(1.5 + Math.random()),
            vy: (Math.random() - 0.5) * 0.5,
            remove: false
          });
        }
      }

      function updateParticles(physics) {
        const anodeX = W * 0.25;
        const cathodeX = W * 0.75;
        const topWireY = H * 0.15;

        for (let i = 0; i < particles.length; i++) {
          let p = particles[i];
          if (p.remove) continue;

          p.x += p.vx || 0;
          p.y += p.vy || 0;

          // GOx 산화전극 반응
          if (p.type === 'glucose' && p.x >= anodeX - 10) {
            if (physics.activity > 5) {
              p.type = 'lactone';
              p.vx = -1.0;
              particles.push({ type: 'electron', x: anodeX, y: H * 0.25, pathStage: 0, remove: false });
              particles.push({ type: 'proton', x: anodeX + 10, y: p.y, vx: 1.8 + Math.random() * 0.5, vy: (Math.random() - 0.5), remove: false });
            }
          }

          // 전자 이동
          if (p.type === 'electron') {
            const speed = 3 + parseFloat(physics.current);
            if (p.pathStage === 0) {
              p.y -= speed;
              if (p.y <= topWireY) { p.y = topWireY; p.pathStage = 1; }
            } else if (p.pathStage === 1) {
              p.x += speed;
              if (p.x >= cathodeX) { p.x = cathodeX; p.pathStage = 2; }
            } else if (p.pathStage === 2) {
              p.y += speed;
              if (p.y >= H * 0.3 + Math.random() * (H * 0.3)) { p.type = 'e_arrived'; }
            }
          }

          // Laccase 환원전극 반응
          if (p.type === 'proton' && p.x >= cathodeX - 10) {
            const eParticle = particles.find(item => item.type === 'e_arrived' && !item.remove);
            const o2Particle = particles.find(item => item.type === 'o2' && item.x <= cathodeX + 20 && !item.remove);

            if (eParticle && o2Particle) {
              p.remove = true;
              eParticle.remove = true;
              o2Particle.type = 'water';
              o2Particle.vx = 1.2;
              o2Particle.vy = (Math.random() - 0.5) * 1.5;
            }
          }

          if (p.x < -20 || p.x > W + 20 || p.y < -20 || p.y > H + 20) {
            p.remove = true;
          }
        }

        particles = particles.filter(p => !p.remove);
      }

      function draw(physics) {
        const anodeX = W * 0.25;
        const cathodeX = W * 0.75;
        const topWireY = H * 0.15;
        const loadX = W * 0.5;

        // 배경
        ctx.fillStyle = '#020617';
        ctx.fillRect(0, 0, W, H);

        // 전해질
        ctx.fillStyle = 'rgba(14, 116, 144, 0.2)';
        ctx.fillRect(anodeX + 15, H * 0.25, (cathodeX - anodeX - 30), H * 0.6);
        ctx.fillStyle = '#94a3b8';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('전해질 용액 (Buffer Solution)', loadX, H * 0.82);

        // 산화전극 (Anode)
        ctx.fillStyle = '#334155';
        ctx.fillRect(anodeX - 12, H * 0.25, 24, H * 0.6);
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        for (let y = H * 0.28; y <= H * 0.8; y += 20) {
          ctx.beginPath();
          ctx.arc(anodeX + 12, y, 5, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 환원전극 (Cathode)
        ctx.fillStyle = '#334155';
        ctx.fillRect(cathodeX - 12, H * 0.25, 24, H * 0.6);
        ctx.strokeStyle = '#06b6d4';
        for (let y = H * 0.28; y <= H * 0.8; y += 20) {
          ctx.beginPath();
          ctx.arc(cathodeX - 12, y, 5, 0, Math.PI * 2);
          ctx.stroke();
        }

        // 라벨
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('산화전극 (Anode)', anodeX, H * 0.9);
        ctx.font = '11px sans-serif';
        ctx.fillText('[GOx 효소]', anodeX, H * 0.96);

        ctx.fillStyle = '#06b6d4';
        ctx.font = 'bold 13px sans-serif';
        ctx.fillText('환원전극 (Cathode)', cathodeX, H * 0.9);
        ctx.font = '11px sans-serif';
        ctx.fillText('[라케이스 효소]', cathodeX, H * 0.96);

        // 회로 & LED
        ctx.strokeStyle = '#64748b';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(anodeX, H * 0.25);
        ctx.lineTo(anodeX, topWireY);
        ctx.lineTo(loadX - 20, topWireY);
        ctx.moveTo(loadX + 20, topWireY);
        ctx.lineTo(cathodeX, topWireY);
        ctx.lineTo(cathodeX, H * 0.25);
        ctx.stroke();

        const pVal = parseFloat(physics.power);
        ctx.beginPath();
        ctx.arc(loadX, topWireY, 15, 0, Math.PI * 2);
        ctx.fillStyle = pVal > 0.1 ? `rgba(250, 204, 21, ${Math.min(1, pVal + 0.3)})` : '#334155';
        ctx.fill();
        ctx.strokeStyle = '#facc15';
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.font = '10px sans-serif';
        ctx.fillText('LED 부하', loadX, topWireY + 26);

        // 입자들
        particles.forEach(p => {
          ctx.beginPath();
          if (p.type === 'glucose') {
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#22c55e';
          } else if (p.type === 'lactone') {
            ctx.arc(p.x, p.y, 5, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
          } else if (p.type === 'electron' || p.type === 'e_arrived') {
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#facc15';
          } else if (p.type === 'proton') {
            ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ef4444';
          } else if (p.type === 'o2') {
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#38bdf8';
          } else if (p.type === 'water') {
            ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
            ctx.fillStyle = '#60a5fa';
          }
          ctx.fill();
        });
      }

      function loop() {
        const physics = calculatePhysics();

        activityOut.textContent = physics.activity;
        voltageOut.textContent = physics.voltage;
        currentOut.textContent = physics.current;
        powerOut.textContent = physics.power;

        spawnParticles(physics.rate);
        updateParticles(physics);
        draw(physics);

        if (isRunning) {
          requestAnimationFrame(loop);
        }
      }

      loop();
    })();
  </script>
</body>
</html>
